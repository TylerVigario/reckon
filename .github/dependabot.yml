# Dependency updates.
#
# Two ecosystems: the one manifest at the root, and the actions the workflows
# pin. Actions are the one people forget, and they are code a pull request
# chooses to run.
#
# Grouped for minor and patch only. A major is where the breakage lives, and in
# a group a bump that is fine is held back by one that is not -- so a major
# arrives on its own and can be refused on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci

name: Something should work differently
description: Propose a change to how it behaves.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Each rule here says why it exists, in the schema and in the guard
        that proves it. If your proposal contradicts one, say which — that is a
        more useful conversation than the feature itself.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it, and what it costs them. Not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Does this contradict a rule the schema enforces?
      description: The table, column or guard it conflicts with, or "no".
      placeholder: "no"
    validations:
      required: true

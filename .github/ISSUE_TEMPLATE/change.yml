name: Something should work differently
description: Propose a change to how it behaves.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `docs/decisions.md` is the authority here, and it records decisions with
        the words that settled them. If your proposal contradicts one, say which
        — that is a more useful conversation than the feature itself.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who has it, and what it costs them. Not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Does this contradict a recorded decision?
      description: A heading from `docs/decisions.md`, or "no".
      placeholder: "no"
    validations:
      required: true

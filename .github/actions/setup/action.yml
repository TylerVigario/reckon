name: Setup CI environment
description: >-
  Install Node at the version .nvmrc pins, cache npm, and install both
  dependency sets — the repository's tooling at the root and the application's
  under app/.

  The caller runs actions/checkout first: a local-path action reference needs
  this file already on disk.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # .nvmrc IS the pin. An input here would be a second place to drift.
        node-version-file: .nvmrc

    - name: Compute npm cache key
      # Hashes the dependency fields of both manifests rather than the
      # lockfiles: a release rewrites the root version in package-lock.json,
      # so a lockfile-hashed key would rotate on every release and leave one
      # stale cache behind each time.
      id: cache-key
      shell: bash
      run: |
        NODE_MAJOR=$(sed -E 's/^[^0-9]*([0-9]+).*/\1/' .nvmrc)
        HASH=$(jq -S -s '[.[] | {dependencies,devDependencies}]' package.json app/package.json \
          | sha256sum | cut -c1-16)
        echo "key=npm-${{ runner.os }}-node${NODE_MAJOR}-${HASH}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          npm-${{ runner.os }}-

    - shell: bash
      run: |
        npm ci --prefer-offline
        npm ci --prefer-offline --prefix app

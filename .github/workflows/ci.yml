name: CI

# One job per assertion, because a required check names a job: a red context
# then says which claim failed rather than that something did. Adding an
# assertion means adding its job and its required context; removing one wedges
# the branch until the ruleset is edited too, which is what makes coverage hard
# to lose quietly.
#
# THE COMMIT STAGE runs before a push as well. Every assertion here that needs
# no running server, browser or outside service -- Format, Lint, Typecheck,
# Unit, the migrations half of Schema and the build half of Build -- is in
# package.json's `ci` as the same command its job runs, and .husky/pre-push runs
# `ci`, as the release's gate does. What runs the built product -- Behaviour,
# and the page Build serves -- stays here. `ci` runs the guard suite too,
# against the machine's own Postgres, beyond that floor. A check added to a job
# and not to `ci` leaves the hook passing having run less, and nothing says so,
# so the two change in the same commit.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: 0
  CI: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema
    runs-on: ubuntu-latest

    # The version this actually runs on. A guard suite that passes against a
    # different major proves less than it appears to -- every id defaults to
    # uuidv7(), which did not exist before 18.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      # The runner owns this cluster outright, so there is no postgres role to
      # sudo to and nothing to sudo with.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The migrator is Drizzle's, run by node from the dependencies.
      - uses: ./.github/actions/setup
      - name: The migrations are the schema
        # The schema is TypeScript and the migrations are generated from it. A
        # change to one without the other is an app expecting columns no
        # database has, found at runtime -- so generating must find nothing to
        # write. It generates into a copy of drizzle/, so the same command runs
        # before a push without touching the working tree.
        run: npm run db:drift
      - name: Every guard, both ways
        # Builds a scratch database, brings it up to date as the server would,
        # proves every guard group, drops it. This asserts the schema applies
        # cleanly from nothing as much as it asserts the guards.
        run: npm run db:test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # Type-aware, so it needs the types svelte-kit sync writes. `npm ci` runs
      # prepare, which runs sync -- but say so, because a lint that silently
      # loses its type information reports nothing and passes.
      - run: npm run lint

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: The rules, the formatters and the CDTFA contract
        run: npm run test
      # The date helpers parse at noon so that no timezone can move a date onto
      # the day before. One run, in one zone, cannot show that -- so the same
      # tests run again at UTC+14 and UTC-11, which are the two ends it breaks
      # at: parsed at midnight, 1 Jan reads as 31 Dec at UTC-11.
      - name: And again at both ends of the date line
        run: npm run test:tz

  behaviour:
    name: Behaviour
    runs-on: ubuntu-latest

    # THE JOB THAT SIGNS IN. Build proves a page renders to a signed-out
    # visitor; every other assertion this repository makes about the running
    # app is made here. Typecheck passing, the build passing and the login page
    # rendering say nothing about whether anything can be saved.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: reckon_ci
      PORT: '5178'
      HOST: 127.0.0.1
      # The server takes its scheme from the proxy in front of it, and assumes
      # https when there is none. Here there is none and it is plain http, so
      # the harnesses send what that proxy would, and this is where it is read.
      PROTOCOL_HEADER: x-forwarded-proto
      # Signs the sessions of a database that is gone when the job ends.
      BETTER_AUTH_SECRET: ci-only-secret-for-a-database-that-ends-with-the-job
      # Email goes to the relay stand-in on this machine (tests/smtp-stand-in.mjs),
      # as it would to a mail server beside the application.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2525'
      SMTP_SECURITY: none
      SMTP_FROM: reckon@kestrel.example
      # Where the links it emails go, and the site each passkey is made for: the
      # server itself, over http, as only an address on this machine may be. A
      # host name, as WebAuthn takes no IP address, so every check asks it there.
      SITE_URL: http://localhost:5178
      # Where the checks keep the passkeys they sign in with (tests/passkeys.mjs).
      RECKON_TEST_PASSKEYS: /tmp/reckon-test-passkeys.json
      # Told to stop, adapter-node waits this long (30 seconds unless set) for
      # the browser's connections to close, and one the browser opened ahead
      # of a request it never sent holds the whole wait. Kept short, a server
      # still running 20 seconds after SIGTERM is held by something of its own.
      SHUTDOWN_TIMEOUT: '2'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run build

      - name: The tax-rate refresh starts, outside SvelteKit
        # It runs under plain Node and imports the app's own CDTFA client and
        # staleness rule, so a $app import anywhere beneath them stops it before
        # it asks about anything. An empty database has no sites, so this needs
        # no network: it proves the script loads, connects and finds its day.
        run: |
          createdb reckon_empty
          PGDATABASE=reckon_empty npm run db:migrate
          PGDATABASE=reckon_empty node scripts/refresh-tax-rates.mjs --dry-run

      - name: The database and the valuation round tax alike
        # Every scope and method of a tax rule's rounding, in SQL and in
        # TypeScript, over the same made-up lines. Nothing is written.
        run: PGDATABASE=reckon_empty node tests/tax-check.mjs

      - name: A mail relay to send to
        # Before the business is set up, so nothing it is to send waits for one.
        run: |
          node tests/smtp-stand-in.mjs &
          for _ in $(seq 1 10); do
            curl -sf -o /dev/null http://127.0.0.1:2526/messages && exit 0
            sleep 1
          done
          echo "::error::the relay stand-in never answered"; exit 1

      - name: A business to run the checks against, owned by one role, served by another that owns none of it
        # The database's default zone is set to one nobody keeps. reckon opens
        # its connections in UTC and names a zone wherever it works out a day,
        # so nothing it shows may depend on the host's zone, and here it would.
        #
        # The two roles of the README's "The database": reckon_owner owns it,
        # and the server connects as reckon, granted rows and nothing more, so
        # anything that quietly needs to own a table fails here first. The owner
        # signs in nowhere: the job's superuser migrates, as a host's postgres
        # could, and db:migrate acts as the owner. The server migrating as it
        # starts is the Build job's.
        run: |
          psql -q -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          CREATE ROLE reckon_owner;
          CREATE ROLE reckon LOGIN PASSWORD 'ci-only-serving-role';
          SQL
          createdb -O reckon_owner reckon_ci
          psql -q -d postgres -c "ALTER DATABASE reckon_ci SET TimeZone = 'Pacific/Kiritimati'"
          npm run db:migrate
          npm run db:seed
          psql -q -v ON_ERROR_STOP=1 -d reckon_ci <<'SQL'
          GRANT USAGE ON SCHEMA public, drizzle TO reckon;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO reckon;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO reckon;
          GRANT SELECT ON drizzle.__drizzle_migrations TO reckon;
          ALTER DEFAULT PRIVILEGES FOR ROLE reckon_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO reckon;
          ALTER DEFAULT PRIVILEGES FOR ROLE reckon_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO reckon;
          SQL

      - name: The role that owns nothing may not migrate, and is told why
        # By hand, db:migrate stops before it tries anything; and a server
        # told to migrate as it starts says the same and does not start,
        # rather than showing the first statement Postgres refused.
        env:
          PGUSER: reckon
          PGPASSWORD: ci-only-serving-role
        run: |
          if out=$(npm run db:migrate 2>&1); then
            echo "::error::db:migrate ran as reckon"; exit 1
          fi
          grep -q "reckon may not act as its owner, reckon_owner" <<<"$out" || {
            echo "$out"; echo "::error::db:migrate did not say why"; exit 1
          }
          if out=$(MIGRATE_ON_START=true timeout 60 node build 2>&1); then
            echo "::error::the server started, told to migrate as reckon"; exit 1
          fi
          grep -q "reckon may not do what the migrations do" <<<"$out" || {
            echo "$out"; echo "::error::the server did not say why"; exit 1
          }

      - name: Start it
        # As the role that owns nothing, checking the database is up to date
        # rather than migrating it.
        run: |
          PGUSER=reckon PGPASSWORD=ci-only-serving-role node build &
          echo $! > /tmp/reckon.pid
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:5178/login" && exit 0
            sleep 1
          done
          echo "::error::the server never answered"; exit 1

      - name: Passkeys for the people the checks act as
        # As the first person gets theirs: scripts/user.mjs gives an invitation
        # link, and a passkey is made with it on the link's page. Someone with
        # Full, and someone with Field, for what that level reaches.
        run: node tests/passkeys.mjs "http://localhost:$PORT" avery@kestrel.example sam@kestrel.example

      - name: The registries and the schema agree
        # Validation has one source of truth for the page and the endpoint --
        # they import the same registry. The database is the third, and this
        # is what stops it drifting into "The database refused that value".
        run: npm run check:schema

      - name: Every route answers, signed in
        run: node tests/smoke.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Better Auth serves only the routes reckon lists
        # Each closed route answers 404, and the two disabledPaths cannot name
        # do nothing here: the reset route hands nothing to another origin, the
        # social callback signs nobody in (#lib/server/auth-paths).
        run: node tests/auth-routes-check.mjs "http://localhost:$PORT"

      - name: Passkeys are made with an invitation or a new link, sign in, are refused where they should be, and are removed
        # Software passkeys, as a phone's would be, against the routes Better
        # Auth serves. It adds a person and takes them away again.
        run: node tests/passkey-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A session lasts until two weeks unused
        # Its dates moved back in the database, as the weeks passing would
        # leave them; only the sessions it opens are touched.
        run: node tests/session-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Each access level reaches what it should, and Field sees its own
        # Before the checks that write, on the seeded business: every route
        # beyond Field is asked of someone with Field and refused.
        run: |
          node tests/access-check.mjs "http://localhost:$PORT" \
            avery@kestrel.example sam@kestrel.example

      - name: Every screen renders, with nothing on the console
        # A page can answer 200 with its body already doomed: SvelteKit renders
        # on the client, so a component that throws leaves the URL changed, the
        # previous screen's header on show and nothing else. The server sees a
        # 200 either way.
        #
        # Every browser check after this one uses the Chrome started here. It is
        # given a minute, and if it is not answering by then the step says so,
        # with Chrome's own words, rather than letting console-check fail to
        # connect to it.
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --remote-debugging-port=9222 --user-data-dir=/tmp/chrome about:blank \
            > /tmp/chrome.log 2>&1 &
          echo $! > /tmp/chrome.pid
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9222/json && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:9222/json; then
            echo "::error::Chrome did not start within a minute"
            cat /tmp/chrome.log
            exit 1
          fi
          node tests/console-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A passkey is made on the link's page and signs in on the sign-in page, in a browser
        # In the Chrome started above, with a virtual authenticator of its own.
        # It adds a person and takes them away again, and leaves the browser
        # signed out: each check after signs itself in.
        run: node tests/sign-in-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A browser without Temporal gets the polyfill, and keeps it for offline
        # This Chrome has Temporal of its own, so every check above takes the
        # browser's path. This one takes it away before the page runs, as a
        # phone without it would be.
        run: node tests/temporal-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Every write works, and the wrong ones are refused
        # Needs the network: creating a site is a CDTFA lookup, and the check
        # reports that as skipped rather than failed if they cannot be reached.
        run: node tests/write-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A person's zone comes from their browser, and travel asks first
        run: node tests/zone-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Past work takes a start and one other, and fills in the third
        run: node tests/past-work-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Stock is received, with its costs, who paid and its receipt
        run: node tests/receive-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Lines are added to a draft, drawn from stock or bought and paid for with receipts
        run: node tests/lines-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A trip is recorded, each leg to whoever caused it, and what it pays its vehicle
        run: node tests/trips-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A person is invited by email and told whenever their passkeys change, and a relay in trouble is tried again or given up on
        # It adds a person and takes them away again, so the checks around it
        # see the business as seeded.
        run: node tests/email-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: A new address for someone who has signed in waits until they use the link sent there, and the old one is told
        # After the email check, for the same reason: it adds people and takes
        # them away again.
        run: node tests/email-change-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: It installs, and time and lines on a draft work with the server out of reach
        # Out of reach for real: the server is stopped between the runs, because
        # the service worker fetches on its own and a flag set on the page would
        # not reach it. The browser the console check started stays up
        # throughout, so the worker, its caches and the capture queue carry
        # across, as on a phone. The server comes back with the job's own
        # environment, so the session survives the restart.
        run: |
          check() { node tests/offline-check.mjs "http://localhost:$PORT" avery@kestrel.example "$1"; }
          check online
          # And it stops when told to, as a service manager expects, rather
          # than waiting to be killed: nothing it starts may keep it running.
          pid="$(cat /tmp/reckon.pid)"
          kill "$pid"
          for _ in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::the server was still running 20 seconds after SIGTERM"; exit 1
          fi
          check offline
          # While the phone is out of reach, the server moves on without it.
          psql -q -v ON_ERROR_STOP=1 -d reckon_ci -f tests/offline-meanwhile.sql
          PGUSER=reckon PGPASSWORD=ci-only-serving-role node build &
          echo $! > /tmp/reckon.pid
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:$PORT/login" && break
            sleep 1
          done
          check back

      - name: Pay is recorded when it is paid, and stands
        # After offline-check, which changes the trip this pays for.
        run: node tests/pay-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: An invoice is sent with its link
        # Last but one: it sends the draft lines-check made, which the checks before it add to.
        run: node tests/send-check.mjs "http://localhost:$PORT" avery@kestrel.example

      - name: Someone with Field walks every screen they are offered, with nothing on the console
        # In a browser of their own, as their own phone would be: the one the
        # checks above used holds Avery's session and what those checks queued.
        # A link that leads them somewhere their access does not reach ends up
        # at /refused, and fails.
        run: |
          kill "$(cat /tmp/chrome.pid)" 2>/dev/null || true
          sleep 1
          google-chrome --headless --disable-gpu --no-sandbox \
            --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-field about:blank \
            > /tmp/chrome-field.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9222/json && break
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:9222/json; then
            echo "::error::Chrome did not start within a minute"
            cat /tmp/chrome-field.log
            exit 1
          fi
          node tests/console-check.mjs "http://localhost:$PORT" sam@kestrel.example

      - name: Stop it
        if: always()
        run: kill "$(cat /tmp/reckon.pid)" 2>/dev/null || true

  build:
    name: Build
    runs-on: ubuntu-latest

    # The built server is served a real schema rather than none. Every page
    # reads the database -- the sign-in page loads the operator row like any
    # other -- so a smoke test without one asserts that the process starts and
    # nothing more.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: reckon_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm run build

      - name: An empty database, which the server, told to, brings up to date as it starts
        run: createdb reckon_ci

      - name: The build produced a server that serves a page
        # A build that emits files nobody runs is not a proven build. This is
        # the cheapest proof that the adapter detects its environment.
        env:
          PORT: '5177'
          HOST: 127.0.0.1
          # Without one the server refuses to start, which is the point.
          BETTER_AUTH_SECRET: ci-only-secret-for-a-database-that-ends-with-the-job
          # The other way a host may run it: connected as the owner, migrating
          # as it starts. The behaviour job's server only checks.
          MIGRATE_ON_START: 'true'
        run: |
          node build &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null "http://127.0.0.1:5177/login"; then
              echo "the sign-in page rendered"
              # Signed out, everything else redirects to it. If this ever
              # answers 200, the guard in hooks.server.ts has stopped running.
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:5177/timesheet")
              [ "$code" = "303" ] || { echo "::error::/timesheet answered $code, expected 303"; exit 1; }
              echo "and an unauthenticated page redirected to it"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the server did not answer on /login within 20s"
          exit 1
